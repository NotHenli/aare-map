<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aare Map – Admin Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔒%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1d2a;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #132d42;
      border-radius: 24px;
      padding: 40px 32px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #1AA3A3, #0d7d7d);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 750;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: #6b8299;
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #0b1d2a;
      border: 1.5px solid #2a4a63;
      border-radius: 12px;
      padding: 14px 16px;
      color: #e2e8f0;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: #1AA3A3;
      box-shadow: 0 0 0 3px rgba(26, 163, 163, 0.15);
    }

    .field input::placeholder {
      color: #3d5a73;
    }

    .otp-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .otp-boxes {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .otp-box {
      width: 46px;
      height: 56px;
      background: #0b1d2a;
      border: 1.5px solid #2a4a63;
      border-radius: 12px;
      color: #fff;
      font: inherit;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: #1AA3A3;
    }

    .otp-box:focus {
      border-color: #1AA3A3;
      box-shadow: 0 0 0 3px rgba(26, 163, 163, 0.18);
    }

    .otp-box.filled {
      border-color: #1AA3A3;
      background: rgba(26, 163, 163, 0.08);
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: linear-gradient(135deg, #1AA3A3, #15857d);
      color: #fff;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: -0.01em;
    }

    .submit-btn:hover { opacity: 0.92; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      font-size: 13px;
      color: #f87171;
      text-align: center;
      display: none;
    }
    .error-msg.show { display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #4d7a99;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #1AA3A3; }

    @media (max-width: 380px) {
      .otp-box { width: 40px; height: 50px; font-size: 20px; }
      .otp-boxes { gap: 5px; }
    }
  </style>
</head>
<body>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="lock-icon">🔐</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Aare Map – Protected Area</p>

    <div class="field">
      <label for="password">Admin Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
    </div>

    <div class="field">
      <label class="otp-label">Authenticator Code</label>
      <div class="otp-boxes" id="otp-boxes">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-idx="0" autocomplete="one-time-code">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-idx="1">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-idx="2">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-idx="3">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-idx="4">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-idx="5">
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>

    <div class="error-msg" id="error-msg"></div>

    <a href="./" class="back-link">← Back to map</a>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');
    const boxes = [...document.querySelectorAll('.otp-box')];

    function getCode() {
      return boxes.map(b => b.value).join('');
    }

    function updateFilled() {
      boxes.forEach(b => b.classList.toggle('filled', b.value.length > 0));
    }

    // Handle typing in each box
    boxes.forEach((box, i) => {
      box.addEventListener('input', e => {
        // Only allow digits
        box.value = box.value.replace(/\D/g, '').slice(0, 1);
        updateFilled();

        if (box.value && i < 5) {
          boxes[i + 1].focus();
        }

        // Auto-submit when all 6 filled
        if (getCode().length === 6) {
          setTimeout(() => form.requestSubmit(), 80);
        }
      });

      // Handle paste (full 6-digit code)
      box.addEventListener('paste', e => {
        e.preventDefault();
        const paste = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        if (!paste) return;
        paste.split('').forEach((ch, j) => {
          if (boxes[j]) boxes[j].value = ch;
        });
        updateFilled();
        const focusIdx = Math.min(paste.length, 5);
        boxes[focusIdx].focus();
        if (paste.length === 6) {
          setTimeout(() => form.requestSubmit(), 80);
        }
      });

      // Handle backspace
      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !box.value && i > 0) {
          boxes[i - 1].focus();
          boxes[i - 1].value = '';
          updateFilled();
        }
      });
    });

    async function doLogin() {
      errorEl.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: document.getElementById('password').value,
            code: getCode()
          })
        });

        const data = await res.json();

        if (data.ok) {
          window.location.href = '/admin.html';
        } else {
          errorEl.textContent = data.error || 'Login failed. Check your credentials.';
          errorEl.classList.add('show');
          // Clear OTP boxes on error
          boxes.forEach(b => b.value = '');
          updateFilled();
          boxes[0].focus();
        }
      } catch (err) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      doLogin();
    });

    // Auto-focus password field
    document.getElementById('password').focus();
  </script>
</body>
</html>
