<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aare Map – Admin Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔒%3C/text%3E%3C/svg%3E">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1d2a;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #132d42;
      border-radius: 24px;
      padding: 40px 32px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #1AA3A3, #0d7d7d);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 750;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 13px;
      color: #6b8299;
      text-align: center;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #8899aa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      background: #0b1d2a;
      border: 1.5px solid #2a4a63;
      border-radius: 12px;
      padding: 14px 16px;
      color: #e2e8f0;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: #1AA3A3;
      box-shadow: 0 0 0 3px rgba(26, 163, 163, 0.15);
    }

    .field input::placeholder {
      color: #3d5a73;
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: linear-gradient(135deg, #1AA3A3, #15857d);
      color: #fff;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: -0.01em;
    }

    .submit-btn:hover { opacity: 0.92; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      font-size: 13px;
      color: #f87171;
      text-align: center;
      display: none;
    }
    .error-msg.show { display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #4d7a99;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #1AA3A3; }
  </style>
</head>
<body>
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="lock-icon">🔐</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Aare Map – Protected Area</p>

    <div class="field">
      <label for="password">Admin Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
    </div>

    <div class="field">
      <label for="code">Authenticator Code</label>
      <input type="text" id="code" name="code" placeholder="6-digit code" required
             inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">Sign In</button>

    <div class="error-msg" id="error-msg"></div>

    <a href="./" class="back-link">← Back to map</a>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: document.getElementById('password').value,
            code: document.getElementById('code').value
          })
        });

        const data = await res.json();

        if (data.ok) {
          // Cookie is set by the API response – redirect to admin
          window.location.href = '/admin.html';
        } else {
          errorEl.textContent = data.error || 'Login failed. Check your credentials.';
          errorEl.classList.add('show');
        }
      } catch (err) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.add('show');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    // Auto-focus the password field
    document.getElementById('password').focus();
  </script>
</body>
</html>
